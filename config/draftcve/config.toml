# draftcve configuration
#
# Each task may use its own model; tasks without a table use [default].
# Finding the introducing commit takes the most reasoning, so it is the
# place to spend a bigger model if you have one.
#
# provider: provider name | none
# name: model name; omit for the provider's own default.

[default]
provider = "ramalama"
name = "qwen3.8-27b"
