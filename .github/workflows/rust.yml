name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  static:
    name: Static code checks
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Check formatting
      run: cargo fmt --all -- --check

  build:
    name: Fedora tests
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora-minimal:45
    steps:
    - name: Install dependencies
      run: dnf install -y cargo rustfmt git-core
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Build
      run: cargo build --verbose
    - name: Run Rust tests
      run: cargo test --verbose
