[package]
name = "cve-report"
version = "0.1.0"
edition = "2024"
description = "A helper program to write CVE records from fixing commits"
license = "MIT AND BSD-3-Clause"

[[bin]]
name = "cve-report"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
async-trait = "0.1.92"
clap = { version = "4.5", features = ["derive", "string"] }
goose-agent = "=0.1.0-alpha.14"
goose-providers = { version = "=0.1.0-alpha.14", features = ["rustls-tls"] }
jiff = "0.2"
jsonschema = { version = "0.33", default-features = false }
minijinja = { version = "2", features = ["json", "preserve_order"] }
quick-xml = "0.42.0"
regex = "1"
rmcp = "3.1"
schemars = { version = "1.2", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time", "net", "io-util", "signal"] }
tokio-util = "0.7.19"
toml = "0.8"

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
tempdir = "0.3"
