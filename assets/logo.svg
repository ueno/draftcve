<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400" width="200" height="400" role="img" aria-label="draftcve">
  <title>draftcve</title>
  <defs>
    <!-- ear of wheat, growing upward from the origin -->
    <g id="ear">
      <path d="M0 0V-34" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
      <g fill="#000">
        <ellipse cx="-2.6" cy="-10" rx="2.2" ry="4.4" transform="rotate(-28 -2.6 -10)"/>
        <ellipse cx="2.6" cy="-10" rx="2.2" ry="4.4" transform="rotate(28 2.6 -10)"/>
        <ellipse cx="-2.6" cy="-17" rx="2.2" ry="4.4" transform="rotate(-28 -2.6 -17)"/>
        <ellipse cx="2.6" cy="-17" rx="2.2" ry="4.4" transform="rotate(28 2.6 -17)"/>
        <ellipse cx="-2.6" cy="-24" rx="2.2" ry="4.4" transform="rotate(-28 -2.6 -24)"/>
        <ellipse cx="2.6" cy="-24" rx="2.2" ry="4.4" transform="rotate(28 2.6 -24)"/>
        <ellipse cx="0" cy="-31" rx="2" ry="4.4"/>
      </g>
    </g>
  </defs>
  <!-- bottle -->
  <path d="M84 40H116V100C116 135 160 145 160 185V368Q160 384 144 384H56Q40 384 40 368V185C40 145 84 135 84 100Z" fill="#000"/>
  <rect x="80" y="40" width="40" height="9" rx="2" fill="#000"/>
  <path d="M110 90V112" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <!-- foam: outlined shapes first, then the same shapes filled on top to merge them -->
  <g id="foam">
    <circle cx="74" cy="42" r="8"/>
    <circle cx="86" cy="30" r="12"/>
    <circle cx="101" cy="22" r="15"/>
    <circle cx="116" cy="31" r="12"/>
    <circle cx="127" cy="42" r="8"/>
    <circle cx="100" cy="40" r="13"/>
    <rect x="85" y="40" width="9" height="34" rx="4.5"/>
    <rect x="107" y="40" width="7" height="20" rx="3.5"/>
  </g>
  <use href="#foam" fill="#000" stroke="#000" stroke-width="5"/>
  <use href="#foam" fill="#fff"/>
  <!-- bubbles -->
  <g fill="#fff" stroke="#000" stroke-width="2">
    <circle cx="62" cy="22" r="4"/>
    <circle cx="140" cy="18" r="3"/>
    <circle cx="70" cy="8" r="2.5"/>
    <circle cx="132" cy="6" r="2"/>
  </g>
  <!-- oval label -->
  <ellipse cx="100" cy="282" rx="56" ry="76" fill="#fff"/>
  <ellipse cx="100" cy="282" rx="50" ry="70" fill="none" stroke="#000" stroke-width="2"/>
  <use href="#ear" transform="translate(97 252) rotate(-24)"/>
  <use href="#ear" transform="translate(103 252) rotate(24)"/>
  <g font-family="Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="middle" fill="#000">
    <text x="100" y="278" font-size="24" textLength="70" lengthAdjust="spacingAndGlyphs">DRAFT</text>
    <text x="100" y="328" font-size="38" textLength="66" lengthAdjust="spacingAndGlyphs">CVE</text>
  </g>
  <path d="M68 288H132" stroke="#000" stroke-width="2"/>
</svg>
